<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光伴学</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Han+Serif+SC:wght@600&family=Source+Han+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="brand" id="brand-home" aria-label="品牌主页" role="button" tabindex="0">
      <div class="brand-mark" role="img" aria-label="品牌标识">Z</div>
      <div class="brand-meta">
        <h1>拾光伴学</h1>
      </div>
    </div>
    <div class="header-search">
      <input id="search-input" type="search" placeholder="输入资料的关键词..." />
    </div>
    <div class="header-quick-actions" id="header-quick-actions">
      <div class="header-study-summary" aria-live="polite">
        <span class="pomodoro-display" id="pomodoro-time-display">00:25:00</span>
        <span class="online" style="opacity: 0.6;">
          <span class="dot"></span><span id="online-count">0</span> 人在线
        </span>
      </div>
      <button class="header-action-btn" id="btn-sites" type="button" aria-expanded="false" aria-controls="global-drawer" aria-label="常用网站">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h4.2a2.5 2.5 0 0 1 1.9.9l1.1 1.3c.3.4.8.6 1.3.6H18A2.5 2.5 0 0 1 20.5 9v8.5A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-11Z" fill="currentColor"/>
        </svg>
      </button>
      <button class="header-action-btn" id="btn-todo" type="button" aria-expanded="false" aria-controls="global-drawer" aria-label="待办事项">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.6 16.8 5.8 13l1.4-1.4 2.4 2.4 6.6-6.6 1.4 1.4-8 8Z" fill="currentColor"/>
          <path d="M4.5 4h15a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13A1.5 1.5 0 0 1 4.5 4Zm.5 2v12h14V6H5Z" fill="currentColor"/>
        </svg>
      </button>
      <button class="header-action-btn" id="btn-study" type="button" aria-expanded="false" aria-controls="global-drawer" aria-label="自习室控制">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.2A1.2 1.2 0 0 1 5.2 4h13.6A1.2 1.2 0 0 1 20 5.2V7h-2V6H6v12h5v2H5.2A1.2 1.2 0 0 1 4 18.8V5.2Z" fill="currentColor"/>
          <path d="M14 10h6v2h-6v-2Zm0 4h6v2h-6v-2Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <aside class="global-drawer" id="global-drawer" aria-hidden="true">
    <div class="global-drawer-panels">
      <section class="global-panel" data-panel="sites" aria-hidden="true">
        <div class="content-header">
          <div class="section-head-main">
            <h2>常用网站</h2>
          </div>
          <div class="section-actions">
            <button class="icon-action-btn" id="open-add-site" type="button" aria-label="添加网站" title="添加网站" data-tooltip="添加网站">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z" fill="currentColor"/>
              </svg>
            </button>
            <button class="icon-action-btn" id="toggle-edit-mode" type="button" aria-pressed="false" aria-label="编辑模式" title="编辑模式" data-tooltip="编辑模式">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 16.9 9.9-9.9 3.1 3.1-9.9 9.9-3.7.6.6-3.7Zm11.3-11.3 1.4-1.4a1.8 1.8 0 0 1 2.6 0l.5.5a1.8 1.8 0 0 1 0 2.6l-1.4 1.4-3.1-3.1Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="site-container" class="site-list site-container"></div>
      </section>

      <section class="global-panel" data-panel="todos" aria-hidden="true">
        <div class="content-header">
          <div class="section-head-main">
            <h2>待办</h2>
          </div>
          <div class="todo-input">
            <input id="todo-input" type="text" placeholder="添加一个待办..." />
          </div>
        </div>
        <div class="todo-list" id="todo-list"></div>
      </section>

      <section class="global-panel" data-panel="study" aria-hidden="true">
        <div class="content-header">
          <div class="section-head-main">
            <h2>自习室控制</h2>
          </div>
          <div class="study-panel-main">
            <div class="pomodoro-inline">
              <span class="pomodoro-label" id="pomodoro-mode">专注中</span>
              <button class="pomodoro-time" id="pomodoro-time" type="button">00:25:00</button>
            </div>
            <button class="icon-action-btn pomodoro-toggle-icon" id="pomodoro-toggle" type="button" aria-label="开始" title="开始" data-tooltip="开始">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="study-control-panel" id="study-control-panel">
          <div class="control-group">
            <label>倒计时设置</label>
            <div class="time-picker" id="time-picker">
              <select id="time-hours" size="5"></select>
              <span>:</span>
              <select id="time-minutes" size="5"></select>
              <span>:</span>
              <select id="time-seconds" size="5"></select>
            </div>
          </div>
          <div class="control-group room-tip">
            <label>给我的一句话</label>
            <input id="room-quote" type="text" placeholder="保持节奏，别急。" />
          </div>
        </div>
      </section>
    </div>
  </aside>
  <div class="global-drawer-backdrop" id="global-drawer-backdrop" aria-hidden="true"></div>

  <main class="layout">
    <aside class="sidebar">
      <section class="nav-section">
        <h2>学科资源</h2>
        <ul id="resource-categories" class="nav-list"></ul>
        <div class="nav-actions">
          <button class="btn ghost" id="open-apply">申请添加</button>
        </div>
      </section>
    </aside>

    <div class="main-content main-scroll-shell" id="main-content">
      <div class="main-content-inner">
        <div class="content" id="home-view" aria-label="主页">
          <div class="home-welcome">
            <h2>欢迎来到拾光伴学</h2>
            <p id="home-intro-text">这里是你的学习发现页，你可以在左侧快速切换学科资源，在右侧沉淀稍后再学清单，让学习节奏更清晰、更轻松。</p>
          </div>
        </div>

        <div class="content hidden" id="resource-content">
          <div class="content-header">
            <div class="title-group">
              <h2 id="resource-title">学科资源</h2>
              <span class="resource-subtitle" id="resource-subtitle">按学科分区浏览当前资源</span>
            </div>
          </div>

          <div id="resource-container" class="card-grid resource-grid-3"></div>
        </div>
      </div>
    </div>

    <aside class="later-card">
      <div class="content-header">
        <div class="section-head-main">
          <h2>稍后再学</h2>
          <div class="chip section-desc">收藏清单</div>
        </div>
      </div>
      <div class="later-list" id="later-list"></div>
    </aside>

  </main>

  <div class="modal" id="add-site-modal">
    <div class="modal-card">
      <h3>添加个人常用网站</h3>
      <div class="form-group">
        <label>网站名称</label>
        <input id="site-title" type="text" placeholder="例如：浙大教务网" />
      </div>
      <div class="form-group">
        <label>主页链接</label>
        <input id="site-url" type="url" placeholder="https://" />
      </div>
      <div class="form-group">
        <label>备注</label>
        <input id="site-desc" type="text" placeholder="可选" />
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-add-site">取消</button>
        <button class="btn primary" id="save-add-site">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="upload-modal">
    <div class="modal-card">
      <h3 id="upload-modal-title">上传学习内容</h3>
      <div class="form-group">
        <label id="upload-title-label">标题</label>
        <input id="upload-title" type="text" placeholder="例如：数据结构课程笔记" />
      </div>
      <div class="form-group">
        <label>链接</label>
        <input id="upload-url" type="url" placeholder="https://" />
      </div>
      <div class="form-group">
        <label>简介</label>
        <input id="upload-desc" type="text" placeholder="一句话描述内容" />
      </div>
      <div class="form-group">
        <label>标签（逗号分隔）</label>
        <input id="upload-tags" type="text" placeholder="视频, 课程, 习题" />
      </div>
      <div class="form-group">
        <label>来源平台</label>
        <input id="upload-platform" type="text" placeholder="例如：B站 / 知乎" />
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-upload">取消</button>
        <button class="btn primary" id="save-upload">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
